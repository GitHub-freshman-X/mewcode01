# Anthropic Messages API example. Copy to your platform config path and protect it.
protocol: anthropic
model: claude-sonnet-4-6
base_url: https://api.anthropic.com
api_key: replace-with-your-anthropic-key
max_tokens: 4096
thinking:
  enabled: true
  budget_tokens: 2048
agent:
  max_iterations: 20
permissions:
  mode: default

# MCP Server 可配置在此用户级文件，项目级 .mewcode/config.yaml 的同名条目会完整覆盖它。
# 发现后的远端工具名固定为 <server>__<tool>，并默认需要权限确认。
mcp_servers:
  filesystem:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "${MCP_WORKSPACE}"]
  issues:
    type: http
    url: ${MCP_ISSUES_URL}
    headers:
      Authorization: Bearer ${MCP_ISSUES_TOKEN}

# For OpenAI Responses API, remove the thinking section and use values like:
# protocol: openai
# model: gpt-4.1-mini
# base_url: https://api.openai-proxy.org/v1
# api_key: replace-with-your-openai-key
