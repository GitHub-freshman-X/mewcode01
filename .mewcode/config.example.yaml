# Anthropic Messages API example. Copy to your platform config path and protect it.
protocol: anthropic
model: claude-sonnet-4-6
base_url: https://api.anthropic.com
api_key: <replace-with-your-anthropic-key>
max_tokens: 4096
thinking:
  enabled: true
  budget_tokens: 2048
agent:
  max_iterations: 20
  context:
    window_tokens: 200000
    summary_output_tokens: 20000
    auto_safety_tokens: 13000
    manual_safety_tokens: 3000
    single_result_chars: 50000
    message_result_chars: 200000
    preview_chars: 2000
    recent_tokens: 10000
    recent_message_minimum: 5
permissions:
  mode: default

# MCP Server 可配置在此用户级文件，项目级 .mewcode/config.yaml 的同名条目会完整覆盖它。
# 发现后的远端工具名固定为 <server>__<tool>，并默认需要权限确认。
mcp_servers:
  filesystem:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "${MCP_WORKSPACE}"]
    env:
      MCP_WORKSPACE: ${MCP_WORKSPACE}
  issues:
    type: http
    url: ${MCP_ISSUES_URL}
    headers:
      Authorization: Bearer ${MCP_ISSUES_TOKEN}

# For OpenAI Responses API, remove the thinking section and use values like:
# protocol: openai
# model: gpt-4.1-mini
# base_url: https://api.openai-proxy.org/v1
# api_key: replace-with-your-openai-key
