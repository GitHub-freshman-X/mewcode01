# Anthropic Messages API example. Copy to your platform config path and protect it.
protocol: anthropic
model: claude-sonnet-4-6
base_url: https://api.anthropic.com
api_key: <replace-with-your-anthropic-key>
max_tokens: 4096
thinking:
  enabled: true
  budget_tokens: 2048
# auto/enabled：官方支持模型使用服务端 Tool Search；其余模型和兼容网关使用本地 ToolSearch，不发送 MCP schema。
# disabled：始终发送全量工具定义。
# 可选值：auto、enabled、disabled。
tool_search: auto
agent:
  max_iterations: 20
  enable_verification_agent: false
  context:
    window_tokens: 200000
    summary_output_tokens: 20000
    auto_safety_tokens: 13000
    manual_safety_tokens: 3000
    single_result_chars: 50000
    message_result_chars: 200000
    preview_chars: 2000
    recent_tokens: 10000
    recent_message_minimum: 5
permissions:
  mode: default
worktree:
  local_files: []
  symlink_directories: []
  retention_hours: 0

